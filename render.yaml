services:
  - type: web
    name: syswatch-ai
    env: docker
    region: oregon # or frankfurt, ohio, singapore, etc.
    plan: free # or starter
    # Build and deploy from the root directory using the Dockerfile
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: syswatch-db
          property: connectionString

databases:
  - name: syswatch-db
    databaseName: syswatch
    user: syswatch_user
    plan: free # or starter
    region: oregon
